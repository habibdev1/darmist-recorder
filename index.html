<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Recorder</title>
    <style>
        #controls {
            z-index: 1;
            margin: 20px;
            text-align: center;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
        }
        #downloadSection {
            z-index: 2;
            display: none;
            text-align: center;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            -webkit-transform: translate(-50%, -50%);
        }
        #recordedVideo {
            display: none;
            margin-top: 20px;
            margin: 20px;
            max-width: 450px;
            max-height: 450px;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <div id="controls">
        <div class="d-flex align-items-center">
            <label for="resolution" class="form-label mb-0 me-2" style="width: -webkit-fill-available;">Select Resolution:</label>
            <select class="form-select" id="resolution">
                <option value="default">Default</option>
                <option value="hd">HD (1280x720)</option>
                <option value="fullhd">Full HD (1920x1080)</option>
                <option value="4k">4K (3840x2160)</option>
            </select>
        </div>
        <button class="btn btn-primary mt-3" id="startBtn">Start Recording</button>
        <button class="btn btn-secondary mt-3" id="stopBtn" style="display:none;">Stop Recording</button>
    </div>
    <div id="downloadSection">
        <video id="recordedVideo" controls></video>
        <button class="btn btn-success mt-3" id="downloadLink" style="display:none;">Download Video</button>        
    </div>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let screenStream;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const recordedVideo = document.getElementById('recordedVideo');
        const downloadLink = document.getElementById('downloadLink');
        const downloadSection = document.getElementById('downloadSection');
        const resolutionSelect = document.getElementById('resolution');


        startBtn.addEventListener('click', async () => {
            let constraints = { video: true, audio: true };


            switch (resolutionSelect.value) {
                case 'hd':
                    constraints.video = { width: { ideal: 1280 }, height: { ideal: 720 } };
                    break;
                case 'fullhd':
                    constraints.video = { width: { ideal: 1920 }, height: { ideal: 1080 } };
                    break;
                case '4k':
                    constraints.video = { width: { ideal: 3840 }, height: { ideal: 2160 } };
                    break;
            }


            screenStream = await navigator.mediaDevices.getDisplayMedia(constraints);
            mediaRecorder = new MediaRecorder(screenStream);


            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };


            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                recordedVideo.src = url;
                recordedVideo.style.display = 'block';
                downloadSection.style.display = 'block';
                
                downloadLink.href = url;
                downloadLink.download = 'Recorded-Video-' + new Date().toISOString() + '.mp4';
                downloadLink.style.display = 'unset';
                downloadLink.textContent = 'Download Video';

                recordedChunks = [];


                // Stop all tracks of the screen stream to stop screen sharing
                screenStream.getTracks().forEach(track => track.stop());
            };


            mediaRecorder.start();
            startBtn.style.display = 'none';
            stopBtn.style.display = 'unset';
        });


        stopBtn.addEventListener('click', () => {
            mediaRecorder.stop();
            stopBtn.style.display = 'none';
            startBtn.style.display = 'unset';
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
